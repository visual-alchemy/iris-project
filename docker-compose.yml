version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: iris_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iris_engine_dev
    ports:
      - "5433:5432"
    volumes:
      - iris_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: iris_mediamtx
    ports:
      - "8554:8554" # RTSP
      - "1935:1935" # RTMP
      - "8888:8888" # HLS
      - "8889:8889" # WebRTC
      - "8890:8890/udp" # SRT
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    depends_on:
      - iris_api

  iris_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iris_api
    environment:
      - DATABASE_URL=ecto://postgres:postgres@postgres:5432/iris_engine_dev
      - SECRET_KEY_BASE=e0448fff16491bbbaf338a6c07ad7f896afe35771e5afa94e1decb0c456081ce
      - PHX_SERVER=true
      - PHX_HOST=localhost
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iris_frontend
    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=http://iris_api:4000
    ports:
      - "3000:3000"
    depends_on:
      - iris_api
    restart: unless-stopped

volumes:
  iris_db_data:
